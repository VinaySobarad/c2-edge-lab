name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: pytest + ruff
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          ruff check src tests
          pytest -q
      - name: example policy validate
        run: lab policy validate -f policy/redirector.policy.yaml
      - name: render nginx and nginx -t
        run: |
          lab policy render-nginx \
            -f tests/fixtures/policy.valid.yaml \
            --backend-host 10.42.2.10 \
            --standalone \
            -o generated/nginx-standalone.conf
          docker run --rm --entrypoint nginx \
            -v "$PWD:/work" -w /work \
            nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10 \
            -t -c /work/generated/nginx-standalone.conf

  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.14.3"
          terraform_wrapper: false
      - name: fmt and validate
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate
